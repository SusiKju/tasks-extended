name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
      - run: cp dist/index.html dist/404.html
      - run: cp -r kinder dist/kinder
      # Ungecachte Versions-Kennung fürs Auto-Reload (useAutoReloadOnNewVersion.ts):
      # dieselbe SHA steckt auch im Bundle (EXPO_PUBLIC_GIT_SHA oben), die App
      # vergleicht beide und lädt sich bei Mismatch selbst neu.
      - run: echo '{"sha":"${{ github.sha }}"}' > dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
